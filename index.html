/* layout: one fixed 1280x720 stage, letterboxed and scaled to fit; HUD controls float top-right */
:root{
  --ink:#07090f;
  --night:#0f1626;
  --panel:#0c111d;
  --amber:#d79a3e;
  --amber-hi:#f3c879;
  --sepia:#efe3c8;
  --muted:#a3967b;
  --thought:#a9cdff;
  --stamp:#c8382c;
  --paper:#d8c39a;
  --paper-ink:#3a2616;
  --wood:#3b281b;
  --f-body:'Galmuri11','Apple SD Gothic Neo','Malgun Gothic',monospace;
  --f-bold:'Galmuri11B','Galmuri11','Apple SD Gothic Neo','Malgun Gothic',monospace;
  --f-disp:'Galmuri14','Galmuri11','Apple SD Gothic Neo','Malgun Gothic',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--sepia);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{position:relative;height:100%;padding-block:8px;padding-inline:16px;display:flex;flex-direction:column}
#viewport{position:relative;flex:1;min-height:0}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;overflow:hidden;background:#000;cursor:pointer;user-select:none;-webkit-user-select:none}
#shaker{position:absolute;inset:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#bg{position:absolute;inset:0;width:1280px;height:720px;z-index:0}

/* ---------- actors */
.actor{position:absolute;bottom:-52px;z-index:3;opacity:0;transition:transform .38s cubic-bezier(.25,.9,.3,1),opacity .3s linear;pointer-events:none}
.actor.L{left:-6px;transform:translateX(-80px)}
.actor.R{right:-6px;transform:translateX(80px)}
.actor.on{opacity:1;transform:none}
.actor img{display:block;image-rendering:pixelated;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite alternate;transition:filter .25s}
.actor.dim img{filter:brightness(.52) saturate(.75)}
@keyframes breathe{from{transform:scaleY(1)}to{transform:scaleY(1.007)}}

/* ---------- poster (montage) */
#poster{position:absolute;left:564px;top:118px;width:152px;z-index:2;transform:rotate(-2deg);transform-origin:50% 40%;transition:transform .55s cubic-bezier(.3,.9,.3,1)}
#poster.focus{z-index:6;transform:translateY(40px) scale(1.75)}
.pc{position:relative;background-color:var(--paper);background-size:100% 100%;image-rendering:pixelated;padding:8px 8px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--paper-ink);box-shadow:0 0 0 2px #8a6c44,4px 5px 0 2px rgba(0,0,0,.45)}
.pin{position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;background:var(--stamp);box-shadow:inset -2px -2px 0 #7a1e16,inset 2px 2px 0 #ef6b5c}
.ph{font-family:var(--f-disp);font-size:30px;line-height:30px;letter-spacing:.06em}
.pa{width:128px;height:128px;background:#1b1712;box-shadow:0 0 0 2px var(--paper-ink)}
.pn{font-family:var(--f-bold);font-size:24px;line-height:24px;letter-spacing:.1em}
.pl{font-size:12px;line-height:14px}
.pstamp{position:absolute;left:50%;top:44%;font-family:var(--f-bold);font-size:36px;line-height:1;color:var(--stamp);padding:6px 10px;border:4px solid var(--stamp);transform:translate(-50%,-50%) rotate(-14deg);opacity:.9;mix-blend-mode:multiply;white-space:nowrap;background:rgba(216,195,154,.15)}
#focusCap{position:absolute;left:0;right:0;top:490px;z-index:6;display:flex;justify-content:center;opacity:0;transition:opacity .3s}
#focusCap.on{opacity:1}
#focusCap span{font-size:24px;line-height:24px;background:var(--amber);color:#1a1008;padding:6px 14px}

/* ---------- dim + evidence */
#dim{position:absolute;inset:0;z-index:4;background:rgba(4,6,12,.62);opacity:0;transition:opacity .35s;pointer-events:none}
#dim.on{opacity:1}
#dim.soft{opacity:.45}
#evidence{position:absolute;left:352px;top:64px;width:576px;z-index:5;background:var(--panel);box-shadow:0 0 0 3px var(--amber),0 0 0 6px #120c06,8px 10px 0 6px rgba(0,0,0,.5);opacity:0;transform:translateY(16px);transition:opacity .28s,transform .28s}
#evidence.on{opacity:1;transform:none}
.evh{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;background:#17120c;border-bottom:3px solid var(--amber)}
.evno{font-size:24px;line-height:24px;background:var(--amber);color:#1a1008;padding:2px 8px}
.evt{font-size:24px;line-height:24px;color:var(--sepia)}
#evc{width:576px;height:324px}
.evf{font-size:24px;line-height:32px;color:var(--muted);padding:6px 14px 8px;border-top:2px solid #2a2116;word-break:keep-all}
.evf:empty{display:none}

/* ---------- lineup */
#lineup{position:absolute;left:0;right:0;top:84px;z-index:5;display:flex;justify-content:center;gap:24px}
.lc{width:144px;opacity:0;transform:translateY(-20px) rotate(var(--r,0deg));transition:opacity .4s,transform .5s cubic-bezier(.3,1.4,.4,1)}
#lineup.on .lc{opacity:1;transform:rotate(var(--r,0deg))}
.lc .pc{gap:4px}
.lc .lm{font-family:var(--f-bold);font-size:12px;line-height:14px}
.lc .ly{font-size:12px;line-height:14px;color:#6b5236}
#bigstamp{position:absolute;left:50%;top:300px;z-index:6;font-family:var(--f-bold);font-size:72px;line-height:1;color:var(--stamp);border:8px solid var(--stamp);padding:12px 26px;transform:translate(-50%,-50%) rotate(-9deg);background:rgba(20,6,4,.35);white-space:nowrap;text-shadow:3px 3px 0 #2a0a06}

/* ---------- dialogue box */
#box{position:absolute;left:28px;right:28px;bottom:16px;height:170px;z-index:7;background:rgba(9,13,24,.9);box-shadow:0 0 0 3px var(--amber),0 0 0 6px #120c06,inset 0 0 0 3px #1c2436;transition:opacity .25s}
#box.off,#box.hide{opacity:0}
#name{position:absolute;left:22px;top:-40px;font-family:var(--f-bold);font-size:24px;line-height:24px;padding:6px 16px;background:var(--amber);color:#1a1008;box-shadow:0 0 0 3px #120c06}
#text{padding:24px 36px 0;font-size:24px;line-height:40px;word-break:keep-all;white-space:pre-wrap;color:var(--sepia)}
#text.mono{color:var(--thought)}
#text .ghost{color:transparent}
#next{position:absolute;right:26px;bottom:14px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid var(--amber);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- overlays */
.ov{position:absolute;inset:0}
#think{z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(4,6,12,.55)}
.tk{width:780px;background:var(--panel);box-shadow:0 0 0 3px var(--thought),0 0 0 6px #050810,10px 12px 0 6px rgba(0,0,0,.5)}
.tkh{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#121d33;border-bottom:3px solid var(--thought);font-family:var(--f-disp);font-size:30px;line-height:30px;color:var(--thought)}
.tkq{padding:22px 28px 18px;font-size:24px;line-height:40px;white-space:pre-line;word-break:keep-all}
.tkbar{height:10px;margin:0 28px 22px;background:#1b2436}
.tkbar i{display:block;height:100%;background:var(--thought);transform-origin:0 50%}
#think.go .tkbar i{animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

#cut{z-index:9;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cut .rays{position:absolute;left:50%;top:50%;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;background:repeating-conic-gradient(from 0deg,rgba(200,56,44,.92) 0deg 5deg,rgba(18,6,6,.94) 5deg 12deg);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#cut .ct{position:relative;font-family:var(--f-bold);font-size:96px;line-height:1;color:#fff3dd;padding:22px 40px;border:10px solid #fff3dd;background:var(--stamp);box-shadow:0 0 0 8px #1a0604,14px 16px 0 8px rgba(0,0,0,.55);text-shadow:5px 5px 0 #4a0c06;transform:rotate(-6deg)}
#cut.go .ct{animation:slam .38s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{from{transform:rotate(-6deg) scale(2.8);opacity:0}60%{opacity:1}to{transform:rotate(-6deg) scale(1)}}

#titlecard{z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 45%,#16203a 0%,#0a0e19 55%,#040509 100%);transition:opacity .45s}
#titlecard::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px);pointer-events:none}
#titlecard.out{opacity:0}
.tck{font-family:var(--f-disp);font-size:30px;line-height:30px;letter-spacing:.3em;color:var(--amber);padding-left:.3em}
.tct{font-family:var(--f-disp);font-size:60px;line-height:72px;color:var(--sepia);text-wrap:balance;text-align:center}
.tcl{width:520px;height:4px;background:var(--amber);transform-origin:50% 50%}
.tcs{font-size:24px;line-height:24px;color:var(--muted)}
#titlecard.go .tck{animation:rise .5s .05s both}
#titlecard.go .tct{animation:type .9s .25s steps(14) both}
#titlecard.go .tcl{animation:wipe .6s .5s cubic-bezier(.3,.9,.3,1) both}
#titlecard.go .tcs{animation:rise .5s .9s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipe{from{transform:scaleX(0)}}

#flash{z-index:11;background:#fff8ea;opacity:0;pointer-events:none}
#endcard{z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(5,7,12,.86);opacity:0;transition:opacity .6s}
#endcard.on{opacity:1}
.ect{font-family:var(--f-disp);font-size:60px;line-height:60px;color:var(--amber);letter-spacing:.08em}
.ecs{font-size:24px;line-height:36px;color:var(--sepia);text-align:center}
#start{z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(5,7,12,.72);cursor:default}
.st-k{font-family:var(--f-disp);font-size:30px;line-height:30px;letter-spacing:.3em;color:var(--amber);padding-left:.3em}
.st-t{font-family:var(--f-disp);font-size:90px;line-height:90px;color:var(--sepia);text-shadow:6px 6px 0 #3b1f0c}
.st-s{font-size:24px;line-height:24px;color:var(--muted)}
.st-h{font-size:24px;line-height:36px;color:var(--muted);text-align:center;margin-top:6px}
.bigbtn{font-family:var(--f-bold);font-size:36px;line-height:36px;padding:16px 34px;background:var(--amber);color:#1a1008;border:0;cursor:pointer;box-shadow:0 0 0 4px #120c06,6px 6px 0 4px rgba(0,0,0,.5)}
.bigbtn:hover{background:var(--amber-hi)}
.bigbtn:focus-visible{outline:4px solid var(--sepia);outline-offset:6px}

/* ---------- HUD controls (outside the scaled stage) */
#ctrl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:24px;z-index:20;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:calc(100% - 48px);transition:opacity .35s}
#ctrl.idle{opacity:0;pointer-events:none}
#ctrl button,#ctrl select{font-family:var(--f-body);font-size:12px;line-height:12px;padding:8px 10px;background:rgba(12,17,29,.92);color:var(--sepia);border:2px solid #5a4329;cursor:pointer;min-height:32px}
#ctrl button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber-hi)}
#ctrl button:hover,#ctrl select:hover{border-color:var(--amber)}
#ctrl button:focus-visible,#ctrl select:focus-visible{outline:2px solid var(--sepia);outline-offset:2px}
#stage.instant *{transition:none!important}
/* ---------- portrait (9:16) layout */
#stage.portrait{width:720px;height:1280px}
#stage.portrait #shaker{background:linear-gradient(#0e0a07 0,#0e0a07 960px,#120c08 960px,#0a0705 100%)}
#stage.portrait #bg{width:1706px;height:960px;left:-493px;top:0}
#stage.portrait .actor{bottom:200px;-webkit-mask-image:linear-gradient(to top,transparent 0,#000 90px);mask-image:linear-gradient(to top,transparent 0,#000 90px)}
#stage.portrait #a-dalton{bottom:180px!important}
#stage.portrait .actor.L{left:-24px}
#stage.portrait .actor.R{right:-24px}
#stage.portrait #poster{left:284px;top:196px;transform:rotate(-2deg) scale(1.25)}
#stage.portrait #poster.focus{transform:translateY(60px) scale(2.2)}
#stage.portrait #focusCap{top:700px;padding:0 24px}
#stage.portrait #focusCap span{text-align:center;line-height:32px}
#stage.portrait #evidence{left:72px;top:80px}
#stage.portrait #box{left:20px;right:20px;bottom:36px;height:220px}
#stage.portrait #text{padding:22px 28px 0}
#stage.portrait #lineup{top:110px;left:40px;right:40px;flex-wrap:wrap;row-gap:36px}
#stage.portrait #bigstamp{top:400px;font-size:64px}
#stage.portrait .tk{width:640px}
#stage.portrait .tct{font-size:50px;line-height:64px;max-width:640px}
#stage.portrait .tcl{width:440px}
#stage.portrait #cut .ct{font-size:80px;padding:20px 30px}
#stage.portrait .st-t{font-size:60px;line-height:60px}
#stage.portrait .ect{font-size:50px;line-height:50px}
#stage.portrait .ecs{padding:0 30px}

body.capture #app{padding:0}
body.capture #ctrl,body.capture #rotate,body.capture #replay{display:none!important}
body.capture #stage{cursor:none}
#rotate{display:none;text-align:center;font-size:12px;line-height:18px;color:var(--muted);padding-top:8px}
@media (orientation:portrait) and (max-width:700px){#rotate{display:block}}
@media (prefers-reduced-motion:reduce){.actor img{animation:none}#cut .rays{animation:none}}
</style>

  <div id="viewport">
    <div id="stage" role="img" aria-label="원자모형 변천을 다룬 탐정 비주얼노벨 애니메이션">

        <canvas id="bg" width="320" height="180"></canvas>
        <div id="poster" hidden>
          <div class="pc">
            <div class="pin"></div>
            <div class="ph">WANTED</div>
            <canvas class="pa" width="64" height="64"></canvas>
            <div class="pn">ATOM</div>
            <div class="pl">신원 미상</div>
            <div class="pstamp" hidden>반례</div>
          </div>
        </div>
        <div id="actors"></div>
        <div id="dim"></div>
        <div id="evidence" hidden>
          <div class="evh"><span class="evno"></span><span class="evt"></span></div>
          <canvas id="evc" width="576" height="324"></canvas>
          <div class="evf"></div>
        </div>
        <div id="lineup" hidden></div>
        <div id="bigstamp" hidden>수사 계속</div>
        <div id="focusCap"><span></span></div>
        <div id="box" class="off">
          <div id="name" hidden></div>
          <div id="text"><span class="typed"></span><span class="ghost"></span></div>
          <div id="next" hidden></div>
        </div>
        <div id="think" class="ov" hidden>
          <div class="tk">
            <div class="tkh">추리 타임</div>
            <div class="tkq"></div>
            <div class="tkbar"><i></i></div>
          </div>
        </div>
        <div id="cut" class="ov" hidden><div class="rays"></div><div class="ct"></div></div>
        <div id="titlecard" class="ov" hidden>
          <div class="tck"></div>
          <div class="tct"></div>
          <div class="tcl"></div>
          <div class="tcs"></div>
        </div>
        <div id="flash" class="ov"></div>
        <div id="endcard" class="ov" hidden>
          <div class="ect">WANTED: ATOM</div>
          <div class="ecs">사건 파일 미결<br>다음 증거가 나타날 때까지, 몽타주는 계속 고쳐진다.</div>
          <button class="bigbtn" id="replay" type="button">처음부터 다시 보기</button>
        </div>
        <div id="start" class="ov">
          <div class="st-k">CASE FILE</div>
          <div class="st-t">WANTED: ATOM</div>
          <div class="st-s">원자 몽타주 수사 기록</div>
          <button class="bigbtn" id="go" type="button">▶ 수사 시작</button>
          <div class="st-h">클릭 · 스페이스 다음 대사　|　A 자동 재생　|　H 대사창 숨기기</div>
        </div>
      </div>
    </div>
  </div>
  <div id="rotate">가로 화면으로 보면 더 크게 보여요</div>
  <div id="ctrl" class="idle">
    <button id="b-auto" type="button" aria-pressed="true">자동 재생 켬</button>
    <button id="b-speed" type="button">속도 1×</button>
    <button id="b-sfx" type="button" aria-pressed="true">효과음 켬</button>
    <button id="b-box" type="button" aria-pressed="false">대사창 보임</button>
    <label for="scene" hidden>장면</label>
    <select id="scene"></select>
    <button id="b-full" type="button">전체 화면</button>
  </div>
</div>

    for (let i = 0; i < 28; i++) {
      const a = i / 28 * Math.PI * 2 + t * .35, w = .055;
      bctx.fillStyle = i % 2 ? 'rgba(215,154,62,.32)' : 'rgba(169,205,255,.16)';
      bctx.beginPath(); bctx.moveTo(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14); bctx.lineTo(cx + Math.cos(a - w) * 400, cy + Math.sin(a - w) * 400); bctx.lineTo(cx + Math.cos(a + w) * 400, cy + Math.sin(a + w) * 400); bctx.fill();
    }
  }
  bctx.drawImage(vigC, 0, 0);
}

// ---------- main loop
const pCtx = pArt.getContext('2d');
function frame(now) {
  drawBg(now);
  const t = now / 1000;
  if (!posterEl.hidden) drawModel(pCtx, posterN, t);
  if (!lineupEl.hidden) lineArts.forEach(a => drawModel(a.c, a.n, t));
  drawEvidence(now);
  requestAnimationFrame(frame);
}

// ---------- runner
const CHAPTERS = STEPS.map((s, i) => s.t === 'title' ? { i, label: s.chapter } : null).filter(Boolean);
async function exec(s) {
  switch (s.t) {
    case 'title': return showTitle(s);
    case 'enter': enter(s.who); return tick(420);
    case 'exit': exit(s.who); return tick(420);
    case 'say': return say(s);
    case 'ev': showEv(s); return tick(600);
    case 'evOff': hideEv(); return tick(340);
    case 'poster': return showPoster(s);
    case 'stamp': return stampPoster();
    case 'cut': return cutIn(s);
    case 'think': return think(s);
    case 'lineup': showLineup(); return tick(1200);
    case 'end': return endSeq();
  }
}
async function play() {
  const my = RUN;
  try { while (idx < STEPS.length) { await exec(STEPS[idx]); if (my !== RUN) return; idx++; syncScene(); } }
  catch (e) { if (!(e instanceof Abort)) console.error(e); }
}
function resetVisuals() {
  tc.hidden = true; tc.classList.remove('go', 'out'); cutEl.hidden = true; thinkEl.hidden = true;
  endEl.hidden = true; endEl.classList.remove('on'); bigStamp.hidden = true;
  posterEl.classList.remove('focus'); capEl.classList.remove('on'); dim(null); deduce = 0;
  evTok++; evEl.classList.remove('on'); evEl.hidden = true; EV = null;
  lineupEl.hidden = true; lineupEl.classList.remove('on');
  clearBox(); box.classList.add('off'); typing = false;
  Object.keys(ACT).forEach(k => { ACT[k].classList.remove('on', 'dim'); ACT[k].querySelectorAll('.emo,.bob').forEach(e => e.getAnimations().forEach(a => a.cancel())); });
  onStage.L = onStage.R = null; posterEl.hidden = true; pStamp.hidden = true;
}
function jump(i) {
  abortAll(); resetVisuals();
  stage.classList.add('instant');
  for (let k = 0; k < i; k++) {
    const s = STEPS[k];
    if (s.t === 'enter') enter(s.who, true);
    else if (s.t === 'exit') exit(s.who, true);
    else if (s.t === 'poster') { setPoster(s.n); posterEl.hidden = false; }
    else if (s.t === 'stamp') pStamp.hidden = false;
    else if (s.t === 'ev') showEv(s, true);
    else if (s.t === 'evOff') { evTok++; evEl.classList.remove('on'); evEl.hidden = true; EV = null; dim(null); }
    else if (s.t === 'lineup') showLineup(true);
  }
  idx = i; syncScene();
  requestAnimationFrame(() => { stage.classList.remove('instant'); play(); });
}

// ---------- input & HUD
function advance() { if (!started) return; if (typing) typeSkip = true; else skipReq = true; }
stage.addEventListener('click', e => { if (e.target.closest('button')) return; advance(); });
const ctrl = $('#ctrl'); let idleT = 0;
function wake() { ctrl.classList.remove('idle'); clearTimeout(idleT); if (started) idleT = setTimeout(() => { if (!ctrl.contains(document.activeElement)) ctrl.classList.add('idle'); }, 2600); }
addEventListener('pointermove', wake); addEventListener('pointerdown', wake);
const bAuto = $('#b-auto'), bSpeed = $('#b-speed'), bSfx = $('#b-sfx'), bBox = $('#b-box'), sel = $('#scene');
CHAPTERS.forEach((c, k) => { const o = document.createElement('option'); o.value = k; o.textContent = c.label; sel.appendChild(o); });
function syncScene() { let k = 0; CHAPTERS.forEach((c, j) => { if (c.i <= idx) k = j; }); sel.value = k; }
function setAuto(v) { auto = v; bAuto.setAttribute('aria-pressed', v); bAuto.textContent = v ? '자동 재생 켬' : '자동 재생 끔'; }
function setSfx(v) { sfxOn = v; bSfx.setAttribute('aria-pressed', v); bSfx.textContent = v ? '효과음 켬' : '효과음 끔'; }
function setBox(v) { boxHidden = v; box.classList.toggle('hide', v); bBox.setAttribute('aria-pressed', v); bBox.textContent = v ? '대사창 숨김' : '대사창 보임'; }
const SPEEDS = [.75, 1, 1.25, 1.5];
bAuto.onclick = () => setAuto(!auto);
bSfx.onclick = () => setSfx(!sfxOn);
bBox.onclick = () => setBox(!boxHidden);
bSpeed.onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; bSpeed.textContent = `속도 ${speed}×`; };
sel.onchange = () => { if (!started) begin(false); jump(CHAPTERS[+sel.value].i); sel.blur(); };
$('#b-full').onclick = () => { const el = $('#app'); try { if (document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen().catch(() => {}); } catch (e) {} };
addEventListener('fullscreenchange', fit);
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { if (!started || e.target.tagName === 'BUTTON') return; e.preventDefault(); advance(); }
  else if (e.key === 'a' || e.key === 'A') setAuto(!auto);
  else if (e.key === 'h' || e.key === 'H') setBox(!boxHidden);
  else if (e.key === 'm' || e.key === 'M') setSfx(!sfxOn);
});
function begin(run = true) {
  started = true; audioInit(); if (AC && AC.state === 'suspended') AC.resume();
  $('#start').hidden = true; wake();
  if (run) { posterEl.hidden = true; idx = 0; RUN++; play(); }
}
$('#go').onclick = e => { e.stopPropagation(); begin(); };
$('#replay').onclick = e => { e.stopPropagation(); jump(0); };

// boot
if (window.__CAPTURE) { document.body.classList.add('capture'); fit(); }
document.fonts.load('24px Galmuri11').finally(() => requestAnimationFrame(frame));
setPoster(0); posterEl.hidden = false;
syncScene();
window.__atom = { jump, STEPS, CHAPTERS, setAuto, get idx() { return idx; }, get ev() { return EV; } };
})();
</script>
